require conf/distro/poky.conf

DISTRO = "pi4-xen"
DISTRO_NAME = "Raspberry Pi 4 Xen single-guest lab"
DISTRO_VERSION = "1.0"
INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " virtualization xen pam"
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan ptest alsa bluetooth wifi 3g nfc pulseaudio zeroconf"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append = " pulseaudio"
DISABLE_VC4GRAPHICS = "1"

# Resource budgets are deliberately centralized here. A 1 GiB or larger Pi4
# is required; firmware reservations and Xen overhead must be checked on board.
PI4_DOM0_MEMORY_MIB ?= "512"
PI4_GUEST1_MEMORY_MIB ?= "256"
PI4_GUEST1_VCPUS ?= "1"
RPI_DOM0_MEM = "${PI4_DOM0_MEMORY_MIB}M,max:${PI4_DOM0_MEMORY_MIB}M"
RPI_DEBUG_XEN_ARGS = "loglvl=info guest_loglvl=info"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"
PREFERRED_VERSION_xen = "4.19.0+stable"
PREFERRED_VERSION_xen-tools = "4.19+stable"
PREFERRED_VERSION_u-boot = "2024.01"
PREFERRED_PROVIDER_u-boot-default-script = "xen-rpi-u-boot-scr"

RPI_USE_U_BOOT = "1"
# Keep firmware selection and Wic destination aligned with the inspected boot chain.
SDIMG_KERNELIMAGE = "u-boot.bin"
RPI_EXTRA_CONFIG:append = "\narm_64bit=1\nkernel=u-boot.bin"
ENABLE_UART = "1"
KERNEL_DEVICETREE = "broadcom/bcm2711-rpi-4-b.dtb"
KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES = "115200;hvc0"

# meta-virtualization adds its legacy rpi-sdimg class globally. This project
# uses Wic only in the outer image; the guest is an unpartitioned ext4 image.
IMAGE_CLASSES:remove = "sdcard_image-rpi"
IMAGE_FSTYPES:remove = "rpi-sdimg"

# The full xen-tools meta-package recommends a device-model QEMU. A PV
# block guest with the kernel blkback backend does not need that device model.
BAD_RECOMMENDATIONS += "qemu"

# Generated local access.inc can override these without embedding credentials
# in this layer. The public key is installed only in Dom0.
PI4_XEN_ACCESS_DIR ?= "${TOPDIR}/../local/credentials"
PI4_XEN_ROOT_PASSWORD_HASH ?= "!"
